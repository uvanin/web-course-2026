<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon — Симон говорит</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="game">
    <h1>Симон говорит</h1>

    <div class="info">
      <div class="info__item">
        <span class="info__label">Уровень:</span>
        <span class="info__value" id="level">0</span>
      </div>
      <div class="info__item">
        <span class="info__label">Статус:</span>
        <span class="info__value" id="status">Нажмите «Старт»</span>
      </div>
    </div>

    <div class="board" id="board">
      <button class="sector sector--green"  data-index="0" aria-label="Зелёный"></button>
      <button class="sector sector--red"    data-index="1" aria-label="Красный"></button>
      <button class="sector sector--yellow" data-index="2" aria-label="Жёлтый"></button>
      <button class="sector sector--blue"   data-index="3" aria-label="Синий"></button>
      <div class="board__center"></div>
    </div>

    <div class="controls">
      <button class="btn btn--start" id="startBtn">Старт</button>
    </div>
  </div>
</body>
</html>
