<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo-list — Лабораторная №3</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1 class="app__title">Список задач</h1>

    <form class="form" id="task-form" novalidate>
      <input type="text" id="task-input" class="form__input" placeholder="Введите задачу..." autocomplete="off">
      <button type="submit" class="form__btn">Добавить</button>
    </form>

    <p class="form__warning" id="warning" hidden>Введите текст задачи!</p>

    <p class="counter" id="counter">Осталось: 0, Выполнено: 0</p>

    <div class="filters" id="filters">
      <label class="filters__label">
        <input type="checkbox" class="filters__checkbox" id="filter-active" checked>
        Активные
      </label>
      <label class="filters__label">
        <input type="checkbox" class="filters__checkbox" id="filter-completed" checked>
        Завершённые
      </label>
    </div>

    <ul class="list" id="task-list"></ul>
  </main>
</body>
</html>
